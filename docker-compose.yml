services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  control-plane:
    build: ./control-plane
    environment:
      PORT: "8080"
      REDIS_ADDR: "redis:6379"
      # REQUIRED: set KRONOS_ADMIN_TOKEN in your shell (16+ chars) -
      # the control plane refuses to start without it, and the mesh
      # nodes present the same value when registering. For throwaway
      # local development only, you may instead uncomment:
      # KRONOS_DEV_OPEN_ADMIN: "1"
      KRONOS_ADMIN_TOKEN: "${KRONOS_ADMIN_TOKEN:-}"
    ports:
      # Loopback only: this API carries bearer tokens and full
      # mesh topology. The dashboard (in the operator's local
      # browser) reaches it there; exposing it beyond the host
      # is a deliberate step that must terminate TLS first.
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis

  dashboard:
    build: ./apps/dashboard
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - control-plane

  mesh-node-1:
    build:
      context: .
      dockerfile: core/daemon/Dockerfile
    environment:
      KRONOS_NODE_NAME: "edge-01"
      KRONOS_ROLE: "edge"
      KRONOS_CONTROL_URL: "http://control-plane:8080"
      # The plane is reached over the compose-internal bridge;
      # its host-published port exists for the dashboard and
      # operator API access. The daemon otherwise refuses to
      # send tokens to non-loopback
      # http:// endpoints. If you expose the plane beyond this
      # network, terminate TLS and switch the URL to https://.
      KRONOS_ALLOW_INSECURE_HTTP: "1"
      KRONOS_CONTROL_TOKEN: "${KRONOS_ADMIN_TOKEN:-}"
      KRONOS_LISTEN_PORT: "51820"
    ports:
      - "51820:51820/udp"
    volumes:
      - node1-state:/home/kronos/.kronos
    depends_on:
      - control-plane

  mesh-node-2:
    build:
      context: .
      dockerfile: core/daemon/Dockerfile
    environment:
      KRONOS_NODE_NAME: "edge-02"
      KRONOS_ROLE: "node"
      KRONOS_CONTROL_URL: "http://control-plane:8080"
      # The plane is reached over the compose-internal bridge;
      # its host-published port exists for the dashboard and
      # operator API access. The daemon otherwise refuses to
      # send tokens to non-loopback
      # http:// endpoints. If you expose the plane beyond this
      # network, terminate TLS and switch the URL to https://.
      KRONOS_ALLOW_INSECURE_HTTP: "1"
      KRONOS_CONTROL_TOKEN: "${KRONOS_ADMIN_TOKEN:-}"
      KRONOS_LISTEN_PORT: "51820"
    ports:
      - "51821:51820/udp"
    volumes:
      - node2-state:/home/kronos/.kronos
    depends_on:
      - control-plane

volumes:
  redis-data:
  node1-state:
  node2-state:
