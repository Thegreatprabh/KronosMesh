name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Daemon tests
        working-directory: core/daemon
        run: cargo test
      - name: TUN + DNS host-integration tests (root)
        working-directory: core/daemon
        run: >-
          sudo -E env "PATH=$PATH" cargo test --lib -- --test-threads=1
          tun_configure_failure_rolls_back_everything
          dns_answers_through_the_real_tun_device
          real_tun_device_icmp_roundtrip

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Vet and test
        working-directory: control-plane
        run: |
          go vet ./...
          go test ./...

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        working-directory: apps/dashboard
        run: |
          npm install
          npm run build

  rust-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Daemon tests (ARM64)
        working-directory: core/daemon
        run: cargo test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Rust dependency audit (cargo audit)
        run: cargo audit --file core/daemon/Cargo.lock
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Go vulnerability check (govulncheck)
        working-directory: control-plane
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  netns-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Install host networking tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2 iputils-ping
      - name: Build daemon (release) and control plane
        run: |
          cargo build --release --manifest-path core/daemon/Cargo.toml
          (cd control-plane && go build -o kronos-control-plane .)
      - name: Two-namespace E2E (TUN + ping + mesh DNS + gateway under netem loss)
        run: sudo bash ./scripts/tun-netns-e2e.sh

  cli-e2e:
    name: cli-e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
      - name: Build control plane + daemon
        run: |
          (cd control-plane && go build -o /tmp/kronos-cp .)
          cargo build --release --manifest-path core/daemon/Cargo.toml
      - name: CLI end-to-end (bench, up, peers, status against a live control plane)
        env:
          KRONOS_ADMIN_TOKEN: ci-admin-token-1234567890
          KRONOS_NODE_NAME: ci-node
          KRONOS_CONTROL_URL: http://127.0.0.1:18099
          KRONOS_CONTROL_TOKEN: ci-admin-token-1234567890
          KRONOS_ALLOW_INSECURE_HTTP: "1"
          KRONOS_STATE_DIR: /tmp/kronos-ci-state
          KRONOS_TUN: "0"
          KRONOS_LISTEN_PORT: "51999"
        run: |
          DAEMON=core/daemon/target/release/kronos-daemon
          "$DAEMON" --help > /dev/null
          "$DAEMON" bench | grep -E 'throughput'
          PORT=18099 /tmp/kronos-cp &
          CP_PID=$!
          trap 'kill $CP_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18099/api/v1/health > /dev/null && break; sleep 1; done
          "$DAEMON" up &
          DAEMON_PID=$!
          trap 'kill $CP_PID $DAEMON_PID 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if "$DAEMON" peers | grep -q 'ci-node'; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { echo "node never appeared in peers"; exit 1; }
          "$DAEMON" peers
          "$DAEMON" peers | grep -q 'online'
          "$DAEMON" status | grep -q 'fingerprint'
          echo "CLI end-to-end OK"
