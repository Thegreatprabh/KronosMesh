# KronosMesh dashboard — production static serving.
#
# The operator's admin credential lives in this origin's
# sessionStorage and is sent to the control plane as a bearer token,
# so the page's script surface is kept as small as possible: a strict
# Content-Security-Policy (no inline scripts, no third-party origins),
# no framing, and no MIME sniffing.
#
# NOTE: connect-src must cover the control-plane origin the build was
# made with (VITE_CONTROL_URL, default http://localhost:8080). If you
# build with a different control-plane origin, update connect-src to
# match or the browser will block the dashboard's API calls.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
