<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <rect width="1200" height="300" fill="#070b14"/>
  <!-- mesh links -->
  <g stroke="#155e75" stroke-width="1.4" stroke-dasharray="5 7" opacity="0.8">
    <path id="l1" d="M140 80 L600 52"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.4s" repeatCount="indefinite"/></path>
    <path id="l2" d="M140 80 L1060 80"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.8s" repeatCount="indefinite"/></path>
    <path id="l3" d="M140 80 L140 230"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.2s" repeatCount="indefinite"/></path>
    <path id="l4" d="M140 80 L1060 230"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="2s" repeatCount="indefinite"/></path>
    <path id="l5" d="M600 52 L1060 80"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.5s" repeatCount="indefinite"/></path>
    <path id="l6" d="M600 52 L140 230"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.7s" repeatCount="indefinite"/></path>
    <path id="l7" d="M600 52 L1060 230"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.3s" repeatCount="indefinite"/></path>
    <path id="l8" d="M1060 80 L140 230"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.9s" repeatCount="indefinite"/></path>
    <path id="l9" d="M1060 80 L1060 230"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.1s" repeatCount="indefinite"/></path>
    <path id="l10" d="M140 230 L1060 230"><animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.6s" repeatCount="indefinite"/></path>
  </g>
  <!-- travelling packets -->
  <circle r="3.5" fill="#34d399">
    <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#l2"/></animateMotion>
  </circle>
  <circle r="3.5" fill="#22d3ee">
    <animateMotion dur="4.1s" repeatCount="indefinite"><mpath href="#l7"/></animateMotion>
  </circle>
  <circle r="3" fill="#34d399" opacity="0.8">
    <animateMotion dur="2.7s" repeatCount="indefinite"><mpath href="#l10"/></animateMotion>
  </circle>
  <!-- nodes -->
  <g>
    <circle cx="140" cy="80" r="15" fill="#22d3ee" opacity="0.18"><animate attributeName="r" values="13;20;13" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.25;0.05;0.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="80" r="7" fill="#22d3ee" stroke="#0e7490" stroke-width="1.5"/>
    <circle cx="600" cy="52" r="15" fill="#34d399" opacity="0.18"><animate attributeName="r" values="13;20;13" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.25;0.05;0.25" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="52" r="7" fill="#34d399" stroke="#065f46" stroke-width="1.5"/>
    <circle cx="1060" cy="80" r="15" fill="#22d3ee" opacity="0.18"><animate attributeName="r" values="13;20;13" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.25;0.05;0.25" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="80" r="7" fill="#22d3ee" stroke="#0e7490" stroke-width="1.5"/>
    <circle cx="140" cy="230" r="15" fill="#34d399" opacity="0.18"><animate attributeName="r" values="13;20;13" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.25;0.05;0.25" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="230" r="7" fill="#34d399" stroke="#065f46" stroke-width="1.5"/>
    <circle cx="1060" cy="230" r="15" fill="#22d3ee" opacity="0.18"><animate attributeName="r" values="13;20;13" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.25;0.05;0.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="230" r="7" fill="#22d3ee" stroke="#0e7490" stroke-width="1.5"/>
  </g>
  <!-- title -->
  <text x="600" y="152" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" letter-spacing="8" fill="#e2e8f0">KRONOS<tspan fill="#22d3ee">MESH</tspan></text>
  <text x="600" y="188" text-anchor="middle" font-family="monospace" font-size="16" letter-spacing="6" fill="#64748b">ZERO-TRUST MESH VPN</text>
</svg>
