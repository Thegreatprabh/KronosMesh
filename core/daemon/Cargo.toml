[package]
name = "kronos-daemon"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "KronosMesh core daemon — Noise_IK encrypted mesh data plane with eBPF fast-path and userspace fallback"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
x25519-dalek = { version = "2.0", features = ["static_secrets", "getrandom"] }
chacha20poly1305 = "0.10"
blake2 = "0.10"
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
anyhow = "1.0"
toml = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }

[profile.release]
opt-level = 3
lto = true
